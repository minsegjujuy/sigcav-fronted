server {
    listen 80;
    server_name seguridadvial-jujuy.online www.seguridadvial-jujuy.online;
    return 301 https://$host$request_uri; # Redirige HTTP a HTTPS automáticamente
}

server {
    listen 443 ssl;
    server_name seguridadvial-jujuy.online www.seguridadvial-jujuy.online;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data: https://*.tile.openstreetmap.org https://unpkg.com;
        connect-src 'self' https://seguridadvial-jujuy.online;
        object-src 'none';
        base-uri 'self';
        frame-ancestors 'none';
        upgrade-insecure-requests;
    " always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    ssl_certificate /etc/letsencrypt/live/seguridadvial-jujuy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seguridadvial-jujuy.online/privkey.pem;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://spring-app-compose:4500;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}